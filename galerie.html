
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj malý vesmír - Galerie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Můj malý vesmír</h1>
        <p>Malá vesmírná galerie</p>
    </header>

    <nav>
        <a href="index.html">Úvod</a>
        <a href="planety.html">Planety</a>
        <a href="galerie.html">Galerie</a>
        <a href="ai/index.html">AI a zdroje</a>
    </nav>

    <main>
        <section>
            <h2>Galerie obrázků</h2>
            <p>Tyto tři obrázky jsou jednoduché ilustrace, ne skutečné fotografie.</p>

            <div class="galerie">
                <div class="karta">
                    <img src="images/zeme.png" alt="Modrá planeta Země">
                    <h3>Země</h3>
                    <p>Naše domovská planeta.</p>
                </div>

                <div class="karta">
                    <img src="images/mars.png" alt="Červená planeta Mars">
                    <h3>Mars</h3>
                    <p>Planeta s načervenalým povrchem.</p>
                </div>

                <div class="karta">
                    <img src="images/mesic.png" alt="Šedý Měsíc s krátery">
                    <h3>Měsíc</h3>
                    <p>Přirozená družice Země.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Školní projekt - Můj malý vesmír</p>
    </footer>
</body>
</html>
